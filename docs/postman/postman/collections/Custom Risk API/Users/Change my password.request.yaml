$kind: http-request
description: Authenticated user self-service password change.
url: "{{baseUrl}}/api/v1/users/me/change-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{password}}",
      "newPassword": "NewTemporaryPassword123!"
    }
order: 1200
