- id: MAINT-009
  source_request: REQ-065
  title: Reduce duplicate CI runs across branch, PR, and post-merge workflows
  type: improvement
  capability: build-toolchain
  phase: null
  status: done
  done_in: v1.21.0
  priority: medium
  confidence: medium
  summary: CI currently runs the same checks multiple times — on the release branch, again
    when a PR is created even with no new changes, and again after merge to main. This
    repetition slows releases without adding confidence. The GitHub Actions trigger
    configuration should be investigated and tightened to eliminate redundant runs while
    preserving release safety.
  acceptance:
  - CI does not re-run identical checks on a PR if the branch has already passed CI with
    the same commit SHA.
  - Post-merge CI does not repeat checks already passed pre-merge unless new code was
    introduced by the merge itself.
  - All required status checks for branch protection and release confidence are still
    satisfied after the change.
  - Release velocity is measurably improved — fewer redundant CI minutes per release.
  remaining:
  - Audit current GitHub Actions workflow triggers (push, pull_request, merge) and
    identify where redundant runs occur.
  - Evaluate options — workflow_run conditions, concurrency groups, required-check
    reuse, merge queue behaviour, or skip-duplicate-steps tooling.
  - Implement the highest-value reduction and confirm branch protection rules still pass.
  dependencies: []
  suggested_agents:
  - devops-engineer
  evidence:
    code:
    - .github/workflows
    tests: []
    notes:
    - Preserve release confidence as the primary constraint — do not skip checks in a
      way that could let a broken commit reach main undetected.
    - Related to REQ-062 (on-demand branch publishing) — both touch CI/CD workflow config
      and can be addressed in the same release if scope permits.
