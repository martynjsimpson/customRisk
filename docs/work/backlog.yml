- id: PM12-CORE
  source_request: REQ-008
  legacy_ids:
  - PM12-01
  - PM12-02
  - PM12-03
  title: Implement risk attachments — first slice on approved storage model
  type: feature
  capability: attachments-evidence
  status: ready
  priority: medium
  confidence: high
  summary: SPIKE-007 produced a complete implementation architecture for attachments (schema, permissions, API, file safety,
    audit). This first slice delivers risk attachments only. Stub tables for ActionAttachment and ReviewAttachment are
    included in the migration to keep the follow-on phases from requiring a destructive migration. No code exists yet —
    entirely greenfield. The PA's schema is concrete enough for the backend developer to proceed without further PA
    consultation.
  acceptance:
  - A Register Admin can upload a file to a risk via the UI. The file appears in the attachment list with correct
    filename, MIME type, and size.
  - A Register Viewer can see the attachment list and download the file. The downloaded file is byte-identical to the
    uploaded file.
  - A Risk Owner can upload to their own risk and download attachments on their own risk. They cannot see attachments
    on a risk they do not own.
  - A Register Viewer cannot upload — the upload button is absent in the UI and POST returns 403.
  - Uploading a file with a disallowed extension (e.g. .exe) is rejected with 422 before any byte is written to storage.
  - Uploading a file larger than ATTACHMENT_MAX_SIZE_MB is rejected with 422.
  - Uploading a file whose detected MIME type does not match its extension (e.g. an .exe renamed to .pdf) is rejected
    with 422.
  - Soft-deleting an attachment removes it from the list and prevents download. The Attachment row exists in the
    database with deletedAt set. No physical file is removed from the filesystem.
  - The risk audit trail shows RISK_ATTACHMENT_UPLOADED and RISK_ATTACHMENT_DELETED events with the correct actor and
    file name.
  - The attachments Docker volume survives a docker compose down / docker compose up cycle with files intact.
  - ActionAttachment and ReviewAttachment tables exist in the database (created by the migration) but have no routes or
    UI in this release.
  - Release documentation covers the new attachments Docker volume, updated backup scope (pgdata + attachments must be
    backed up together), ATTACHMENT_STORAGE_LOCAL_PATH, ATTACHMENT_MAX_SIZE_MB (default 25), and
    ATTACHMENT_ALLOWED_MIME_TYPES defaults.
  - Help content in frontend/public/help/en/ updated to describe attachment upload, download, and soft-delete for risks.
  remaining:
  - Principal Architect to add Attachment, RiskAttachment, ActionAttachment (stub), ReviewAttachment (stub) models and
    ATTACHMENT enum value to AuditObjectType in schema.prisma, then run prisma migrate dev. Full schema is in
    docs/spikes/SPIKE-007.md Recommendation 1 — backend developer should not modify the schema before the PA adds it
    to avoid drift.
  - Backend developer to implement StorageProvider interface at backend/src/services/storage/storageProvider.ts
    (four-method contract — put, get, delete, exists) and LocalFileStorageProvider implementation.
  - Backend developer to wire ATTACHMENT_STORAGE_PROVIDER, ATTACHMENT_STORAGE_LOCAL_PATH, ATTACHMENT_MAX_SIZE_MB, and
    ATTACHMENT_ALLOWED_MIME_TYPES env vars at application startup. LocalFileStorageProvider creates the storage
    directory on startup if absent.
  - Backend developer to implement AttachmentService in backend/src/services/attachmentService.ts covering upload,
    list, download, and soft-delete. Use multer (memory storage) for multipart parsing. Use file-type library for
    server-side MIME detection (do not trust client Content-Type). Enforce extension allow-list before MIME check.
    Full API shape and safety rules in docs/spikes/SPIKE-007.md Recommendations 3 and 4.
  - Backend developer to add four routes under /api/v1/registers/:registerId/risks/:riskId/attachments — upload (POST),
    list (GET), download (GET /:attachmentId/download), soft-delete (DELETE /:attachmentId). Permission matrix in
    docs/spikes/SPIKE-007.md Recommendation 2.
  - Backend developer to write RISK_ATTACHMENT_UPLOADED and RISK_ATTACHMENT_DELETED audit events in the same Prisma
    transaction as the business change. Audit event detail in docs/spikes/SPIKE-007.md Recommendation 5.
  - Backend developer to add attachments named volume to docker-compose.yml and docker-compose.release.yml.
  - Frontend developer to add attachment list panel to the risk detail view — upload control, filename/type/size
    display, download link per attachment, delete button shown only when canDelete = true (returned by list API).
  - Test engineer to cover upload, list, download, and soft-delete permission paths; file safety rejection paths
    (disallowed extension, oversized file, MIME mismatch); and audit event correctness.
  - Release Manager to update operator README with Docker volume instructions and backup scope expansion as detailed in
    docs/spikes/SPIKE-007.md Recommendation 7.
  dependencies:
  - PM7-CORE
  suggested_agents:
  - principal-architect
  - backend-developer
  - frontend-developer
  - test-engineer
  evidence:
    code:
    - backend/prisma/schema.prisma
    - backend/src/permissions/riskAccess.ts
    tests: []
    docs:
    - docs/decisions/ADR-0006-attachment-storage.md
    - docs/spikes/SPIKE-007.md
    notes:
    - SPIKE-007 is the authoritative reference for all implementation decisions. The schema, permission matrix, API
      shape, file safety controls, and audit model are fully specified there.
    - principal-architect must add the schema before the backend-developer begins, as the schema is the foundation for
      all other backend work.
    - ActionAttachment and ReviewAttachment stub tables are included in the PM12-CORE migration intentionally — they
      have no routes or logic in this release but must be created now to avoid a future destructive migration.
    - Action and review attachment follow-on phases are tracked as PM12-04 and PM12-05 respectively. Physical file
      deletion via orphan cleanup is PM12-06.
