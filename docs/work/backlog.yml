- id: DRAFT-UNIFIED
  source_request: null
  title: Implement unified draft system for all register settings
  type: refactor
  capability: config-lifecycle-templates
  status: ready
  priority: high
  confidence: high
  summary: The register settings architecture has an undocumented split — some fields travel
    through the draft and are promoted on publish (Category A), others are written directly
    to the Register row and bypass the draft (Category B). SPIKE-008 demonstrates this split
    cannot be fixed field-by-field; every new special-case causes regressions. The fix is to
    move all register settings fields to the always-promote path — all edits in draft mode
    route through updateDraftConfig; all fields are promoted unconditionally on publish.
    Outside draft mode the direct-write path remains correct. This is the prerequisite for
    PM8-CORE and for safely adding any new register settings in future.
  acceptance:
  - All fields in ConfigSnapshotRegisterSettings are promoted unconditionally on publish,
    regardless of whether the draft originated from a template. The sourceTemplateVersionId
    conditional in configVersion.publish.service.ts applies only to linkedTemplateVersionId.
  - In draft mode, all fields in RegisterSettingsTab route through updateDraftConfig (not
    PATCH /registers/:registerId). The direct-write path is only used when no draft is active.
  - Publishing a manual draft correctly persists name, description, riskIdPrefix,
    riskIdZeroPaddingEnabled, riskIdZeroPaddingWidth, defaultNewRiskState, reviewsEnabled,
    defaultReviewFrequencyMonths, allowViewerExport, customFieldValidationEnabled,
    reviewStatusPosition, reviewCommentMode, and reviewAttestationText.
  - No regression to non-draft-mode save behaviour — direct edits outside draft mode continue
    to apply immediately via PATCH /registers/:registerId.
  - responseActionMode continues to work correctly (already Category A with data migration;
    no change needed).
  - All existing config lifecycle tests pass. New tests cover the always-promote path for
    at least three previously Category B fields.
  - Architecture docs updated to codify the unified draft standard so future developers know
    the rule (all new settings fields go through draft in draft mode).
  remaining:
  - >-
      Backend developer to move all register settings fields out of the sourceTemplateVersionId
      conditional in configVersion.publish.service.ts into the always-promote block. Only
      linkedTemplateVersionId remains inside the conditional. Reference: SPIKE-008 Recommendation
      section "What needs to change technically — Backend".
  - >-
      Frontend developer to update RegisterSettingsTab.tsx so all field blur/change handlers
      call updateDraftConfig when in draft mode, matching the pattern established by
      reviewCommentMode and reviewAttestationText handlers. Reference: SPIKE-008 Recommendation
      section "What needs to change technically — Frontend".
  - Principal Architect to update or create architecture docs codifying the unified draft
    standard, so the rule is documented for future developers.
  - Test engineer to add tests covering the always-promote path and verify no Category B
    regressions remain.
  dependencies: []
  suggested_agents:
  - principal-architect
  - backend-developer
  - frontend-developer
  - test-engineer
  evidence:
    code:
    - backend/src/services/configVersion.publish.service.ts
    - backend/src/services/configVersion.draft.service.ts
    - frontend/src/features/configuration/RegisterSettingsTab.tsx
    tests:
    - backend/test/configVersion.test.mjs
    - frontend/test/configuration.test.mjs
    docs:
    - docs/spikes/SPIKE-008.md
    notes:
    - SPIKE-008 is the authoritative reference. Full field-by-field analysis and technical
      change description in that document.
    - The engineering reference doc docs/architecture/register-config-draft-system.md
      (created during v1.27.0, preserved on release branch) should be merged to main and
      updated to reflect the unified standard once this work ships.
    - principal-architect is listed because this item introduces a documented architectural
      standard and touches configVersion.publish.service.ts (a core service). PA should
      write the architecture doc update and review the backend changes before they merge.
    - >-
        Provenance: extracted from the abandoned v1.27.0 release; no originating request exists.
