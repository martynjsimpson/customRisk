- id: PM13-03
  source_request: REQ-002
  legacy_ids: []
  title: Harden API key authentication and deactivated-user enforcement
  type: security
  capability: api-keys
  status: needs-refinement
  priority: high
  confidence: medium
  summary: ADR-0009 and the current API key service both call out a remaining hardening gap around key-auth request enforcement
    and immediate deactivated-user invalidation; this is explicitly out of v1.9.0 unless release sign-off pulls it forward.
  acceptance:
  - API key request middleware verifies key-hash match, revocation state, expiry, and owning user active state on every authenticated
    request.
  - Deactivating a user prevents that user's API keys from authenticating without relying on manual admin revocation.
  - Automated tests cover revoked, expired, and deactivated-owner key-auth rejection paths.
  - Release and security docs describe the final offboarding enforcement behaviour accurately.
  remaining:
  - Confirm whether v1.9.0 should ship before this hardening item or wait for it.
  - Implement the key-auth middleware enforcement and regression tests when the follow-up is approved.
  - Close the current documentation caveat in ADR-0009 once the hardening work is actually delivered.
  dependencies:
  - PM13-01
  suggested_agents:
  - product-manager
  - backend-developer
  - test-engineer
  evidence:
    code:
    - backend/src/services/apiKeys.service.ts
    tests:
    - backend/test/apiKeys.test.mjs
    docs:
    - docs/decisions/ADR-0009-api-key-scope-and-saved-views.md
    notes:
    - This is a newly explicit follow-up item distilled from current code and ADR evidence so Planning V3 does not hide the
      known hardening gap inside PM13-01.
    - '`backend/src/middleware/authenticate.ts` currently authenticates JWT bearer tokens, not API keys.'
