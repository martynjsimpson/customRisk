- id: BUG-002
  source_request: REQ-013
  title: Fix SavedViewsPanel crash on /registers — views.map is not a function
  type: bug
  capability: reporting-saved-views
  phase: null
  status: done
  done_in:
  - v1.10.0
  priority: critical
  confidence: high
  summary: SavedViewsPanel.tsx calls .map() on `views` at line 85, but `views` is not an array when the crash occurs. The
    /registers page throws an unhandled application error and becomes completely unusable. Root cause is either a missing
    array guard around the .map() call, an API response that returns a non-array value (object, null, or error shape), or
    a race condition where `views` is not yet initialised before the render. Fix must add a defensive guard at minimum, and
    confirm the API response contract matches the expected array type.
  observed_behaviour:
  - Navigating to /registers throws "views.map is not a function" at SavedViewsPanel.tsx:85.
  - The entire page becomes unusable due to the unhandled React error boundary.
  expected_behaviour:
  - SavedViewsPanel renders without error when saved views are available, empty, or still loading.
  - If the API returns an unexpected shape, the panel degrades gracefully rather than crashing.
  acceptance:
  - SavedViewsPanel does not call .map() on a non-array value under any conditions (loading, empty, error, or populated).
  - The fix is verified against both the empty-views state and the normal populated-views state.
  - No regression to the SavedViewsPanel feature behaviour (create, apply, delete saved views) is introduced.
  - Frontend tests cover the crash scenario (null/undefined/non-array views response).
  remaining:
  - Inspect SavedViewsPanel.tsx line 85 and the surrounding views fetch/initialisation code to confirm root cause.
  - Check the savedViews API client and route handler to confirm what shape is returned on error or empty state.
  - Add a defensive Array.isArray guard or initialise views as [] to prevent the crash.
  - Add or update frontend tests to cover the non-array views case.
  dependencies: []
  suggested_agents:
  - Frontend Developer
  - Test Engineer
  evidence:
    code:
    - frontend/src/features/risks/SavedViewsPanel.tsx
    - frontend/src/api/savedViews.api.ts
    tests:
    - frontend/test/savedViews.behavior.test.tsx
    - frontend/test/savedViews.test.mjs
    docs: []
    notes:
    - Stack trace: SavedViewsPanel@SavedViewsPanel.tsx:85 — confirmed crash point is the .map() call on views.
    - This is a regression introduced with the v1.9.0 saved-views feature (PM11-01). The feature shipped but the non-array
      edge case was not caught in testing.
    - Fix is likely small (one guard or initialiser) but must be verified against the full saved-views UX to avoid silent regressions.
