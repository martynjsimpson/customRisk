- id: PM4-TEMPLATE-EXTENSIONS
  source_request: REQ-012
  legacy_ids: []
  title: Extend the template library beyond the shipped baseline
  type: feature
  capability: config-lifecycle-templates
  phase: 4
  status: deferred
  priority: medium
  confidence: medium
  summary: The current product appears to ship the core global-template baseline, but richer template-library ideas from the
    product extension doc are not otherwise captured in Planning V3.
  acceptance:
  - Template lifecycle expectations are explicit for any future deprecated or retired states, not just active versus inactive.
  - Register creation from templates can expose richer preview metadata such as intended use, assumptions, and included configuration
    scope if product still wants that experience.
  - The product has an explicit decision on whether starter/example risks belong in template-driven register creation.
  - Any future template-local or shareable-template model is separated clearly from the current shipped global-template baseline.
  remaining:
  - Decide which, if any, of lifecycle states, preview content, starter risks, and register-local templates should become
    real roadmap scope.
  - Confirm whether change notes and richer version metadata are needed beyond the current published-version baseline.
  - Keep these extension ideas out of PM4-CLOSEOUT so the shipped baseline stays clearly closed.
  dependencies:
  - PM4-CLOSEOUT
  suggested_agents:
  - Product Manager
  - Principal Architect
  - Backend Developer
  - Frontend Developer
  evidence:
    code:
    - backend/src/services/template.service.ts
    - backend/src/services/registers.service.ts
    - frontend/src/pages/TemplatesPage.tsx
    - frontend/src/features/configuration/TemplateLinkPanel.tsx
    tests:
    - backend/test/configVersion.test.mjs
    - frontend/test/configVersion.test.mjs
    docs:
    - docs/product/prd.md
    missing:
    - No current code or test evidence for starter-risk inclusion, richer template preview metadata, or explicit deprecated/retired
      template lifecycle behaviour.
    notes:
    - This item distils the still-unshipped template-library ideas so the product extension doc is no longer the only place
      they are captured.
- id: PM2-05A
  source_request: REQ-010
  legacy_ids:
  - PM2-05
  title: Close the remaining person-assignment admin and audit gaps
  type: improvement
  capability: person-identity
  phase: 2
  status: needs-audit
  priority: medium
  confidence: medium
  summary: Core person-reference support is live, and a system-admin unresolved-person route exists, but admin usability,
    delete-snapshot coverage, and assignment audit readability still need a focused verification pass and likely a small follow-up
    change.
  acceptance:
  - Admin users can find unresolved person references and owner assignments without direct database inspection.
  - Risk-owner assignment changes produce clear, non-secret audit evidence.
  - Permission checks continue to prevent unresolved person references from gaining edit authority.
  remaining:
  - Decide whether the existing system-admin unresolved-person route is sufficient on its own or still needs a dedicated UI
    surface.
  - Confirm whether assignment-change audit coverage is complete and readable for create, update, correction, and delete-snapshot
    paths.
  - Implement the missing admin view or audit coverage only after the audit narrows the gap.
  dependencies: []
  suggested_agents:
  - Product Manager
  - Backend Developer
  - Frontend Developer
  - Test Engineer
  evidence:
    code:
    - backend/src/routes/persons.routes.ts
    - backend/src/services/personReference.service.ts
    - backend/src/permissions/riskAccess.ts
    tests:
    - backend/test/personReferences.test.mjs
    - frontend/test/riskOwner.behavior.test.tsx
    docs:
    - docs/planning/groups/group-01-finish-started-work.md
    notes:
    - The backend route evidence now exists in Planning V3; old planning is only needed for optional historical context.
    - Current code exposes `/persons/unresolved` for System Admins, but no dedicated unresolved-person frontend admin view
      was found in the audit.
  notes: 'PM2-05 (email-only owner access permission fix) shipped in v1.9.0. Remaining scope: admin UI for unresolved person
    references and assignment audit gap coverage.'
- id: PM11-01
  source_request: REQ-001
  legacy_ids:
  - PM11-01
  - PM11-02
  - PM11-03
  - PM11-07
  title: Ship personal saved views and tighten reporting-export foundations
  type: feature
  capability: reporting-saved-views
  phase: 11
  status: done
  priority: high
  confidence: medium
  summary: Personal saved-view data model, routes, UI, and audit hooks are part of the active v1.9.0 release scope, but the
    feature still needs release-readiness verification, flag decisions, and a clear boundary against later shared-view/report-builder
    work.
  acceptance:
  - Users can create, list, apply, update, and delete personal saved views for filters, sort, and column state.
  - Saved-view operations are register-scoped, permission-checked, and audited.
  - The initial release explicitly excludes shared views, charts, scheduled reports, and report-builder scope.
  - Exported data continues to respect permissions and matches visible filtered data.
  remaining:
  - Verify current feature-flag defaults and confirm whether the product is ready to expose saved views by default.
  - Confirm release notes, docs, and test evidence for the intended v1.9.x saved-view scope.
  - Keep report-builder, shared views, scheduled reports, charts, CSV import, and broader export polish out of v1.9.0 unless
    explicitly pulled into scope.
  dependencies:
  - PM4-CLOSEOUT
  suggested_agents:
  - Product Manager
  - Backend Developer
  - Frontend Developer
  - Test Engineer
  - Release Manager
  evidence:
    code:
    - backend/src/services/savedViews.service.ts
    - backend/src/routes/savedViews.routes.ts
    - frontend/src/features/risks/SavedViewsPanel.tsx
    tests:
    - backend/test/savedViews.test.mjs
    - frontend/test/savedViews.behavior.test.tsx
    - frontend/test/savedViews.test.mjs
    docs:
    - docs/decisions/ADR-0009-api-key-scope-and-saved-views.md
    missing:
    - No clear evidence yet that the savedViews feature flag is enabled for normal release use.
    - Risk CSV export currently exports core risk columns rather than arbitrary saved-view column state.
    notes:
    - Personal saved views are implemented and tested on this branch; the remaining gap is release verification and final
      feature-flag confirmation.
  done_in:
