  title: Add configurable formulas and inherent-residual scoring
  type: feature
  capability: advanced-scoring
  phase: 6
  status: ready
  priority: high
  confidence: medium
  summary: The current product has basic scoring, matrix, and risk-ID foundations, but it still lacks the broader scoring
    methodology model described in the PRD.
  acceptance:
  - Registers can define supported score formulas safely, with validation and recalculation controls.
  - Registers can enable inherent and residual risk fields without breaking existing single-score registers.
  - Residual and inherent scoring outputs are visible consistently in API, UI, and exported data where enabled.
  - Bulk or workflow updates introduced by the scoring model remain permission-safe and auditable.
  remaining:
  - Finalise the scoring configuration model and migration path from fixed scoring.
  - Define the smallest releasable inherent-residual slice before touching later residual-suggestion ideas.
  - Confirm how much of PM6 should ship before PM11, PM10, and PM12 consume the new data model.
