- id: PM13-01
  source_request: REQ-002
  legacy_ids:
  - PM13-01
  title: Finish and verify API key management baseline
  type: security
  capability: api-keys
  phase: 13
  status: done
  priority: high
  confidence: medium
  summary: Admin oversight routes plus user self-service API key routes, services, audit actions, and UI paths are part of
    the active v1.9.0 release scope, and the current branch still has active uncommitted PM13-01 implementation changes.
  acceptance:
  - Users can create, list, and revoke their own API keys without ever retrieving the raw key again after creation.
  - System Admins can list and revoke API keys across users for oversight and offboarding.
  - Audit logs record creation and revocation using key prefixes only and never expose raw keys or hashes.
  - Authentication and offboarding behaviour are explicitly documented, including any deferred hardening gaps.
  remaining:
  - Re-audit the current branch state once the active API key changes are stable.
  - Run backend and frontend API key regression tests before release sign-off.
  - Keep key-based authentication hardening and deactivated-user enforcement explicitly split into follow-up PM13-03 instead
    of silently treating them as done here.
  - Verify release docs and UX copy align with the accepted inherit-scope design.
  dependencies: []
  suggested_agents:
  - Product Manager
  - Backend Developer
  - Frontend Developer
  - Test Engineer
  - Release Manager
  evidence:
    code:
    - backend/src/services/apiKeys.service.ts
    - backend/src/routes/apiKeys.routes.ts
    - frontend/src/pages/ApiKeysPage.tsx
    tests:
    - backend/test/apiKeys.test.mjs
    - frontend/test/apiKeys.behavior.test.tsx
    - frontend/test/apiKeys.test.mjs
    docs:
    - docs/decisions/ADR-0009-api-key-scope-and-saved-views.md
    branch_worktree:
    - backend/src/controllers/apiKeys.controller.ts
    - backend/src/routes/apiKeys.routes.ts
    - backend/src/routes/index.ts
    - backend/src/routes/users.routes.ts
    - backend/src/services/apiKeys.service.ts
    - backend/src/validators/apiKeys.schemas.ts
    - backend/test/apiKeys.test.mjs
    - frontend/src/api/apiKeys.api.ts
    - frontend/src/pages/ApiKeysPage.tsx
    - frontend/src/pages/ProfilePage.tsx
    - frontend/test/apiKeys.behavior.test.tsx
    - frontend/test/apiKeys.test.mjs
    missing:
    - API-key request authentication middleware is not implemented in v1.9.0 and remains PM13-03.
    - Deactivated-user invalidation for key-auth requests is not implemented in v1.9.0 and remains PM13-03.
    notes:
    - Current repo state shows active v1.9.0 implementation rather than a settled audit-only candidate.
  done_in:
  - v1.9.0
- id: PM13-03
  source_request: REQ-002
  legacy_ids: []
  title: Harden API key authentication and deactivated-user enforcement
  type: security
  capability: api-keys
  phase: 13
  status: deferred
  priority: medium
  confidence: medium
  summary: ADR-0009 and the current API key service both call out a remaining hardening gap around key-auth request enforcement
    and immediate deactivated-user invalidation; this is explicitly out of v1.9.0 unless release sign-off pulls it forward.
  acceptance:
  - API key request middleware verifies key-hash match, revocation state, expiry, and owning user active state on every authenticated
    request.
  - Deactivating a user prevents that user's API keys from authenticating without relying on manual admin revocation.
  - Automated tests cover revoked, expired, and deactivated-owner key-auth rejection paths.
  - Release and security docs describe the final offboarding enforcement behaviour accurately.
  remaining:
  - Confirm whether v1.9.0 should ship before this hardening item or wait for it.
  - Implement the key-auth middleware enforcement and regression tests when the follow-up is approved.
  - Close the current documentation caveat in ADR-0009 once the hardening work is actually delivered.
  dependencies:
  - PM13-01
  suggested_agents:
  - Product Manager
  - Backend Developer
  - Test Engineer
  - Release Manager
  evidence:
    code:
    - backend/src/services/apiKeys.service.ts
    tests:
    - backend/test/apiKeys.test.mjs
    docs:
    - docs/decisions/ADR-0009-api-key-scope-and-saved-views.md
    notes:
    - This is a newly explicit follow-up item distilled from current code and ADR evidence so Planning V3 does not hide the
      known hardening gap inside PM13-01.
    - '`backend/src/middleware/authenticate.ts` currently authenticates JWT bearer tokens, not API keys.'
