- id: PM6-RESIDUAL-SUGGESTIONS
  source_request: REQ-004
  legacy_ids: []
  title: Use child actions as control evidence for residual risk suggestions
  type: feature
  capability: advanced-scoring
  phase: 6
  status: ready
  priority: medium
  confidence: medium
  summary: Residual suggestion logic driven by child-record response actions is not implemented, and its scope was previously
    captured only in the product extension doc rather than in Planning V3.
  acceptance:
  - Registers that enable both inherent-residual scoring and child-record response actions can configure residual suggestion
    behaviour without forcing automatic residual updates.
  - Suggested residual likelihood, impact, score, and level can be explained from action inputs, status/category effects,
    and register rules.
  - Users who can edit residual fields may optionally apply suggested values, while users without that permission can at most
    view them.
  - Audit evidence records configuration changes and user application of suggested values without requiring audit of every
    suggestion display.
  remaining:
  - Decide the smallest releasable slice for categories, status multipliers, diminishing returns, caps, and apply-suggestion
    UX.
  - Confirm which parts belong in PM6 versus follow-on child-action configuration work once PM7 is real.
  - Add concrete API and test planning only after PM6-CORE and PM7-CORE are stable enough to consume.
  dependencies:
  - PM6-CORE
  - PM7-CORE
  suggested_agents:
  - Product Manager
  - Principal Architect
  - Backend Developer
  - Frontend Developer
  - Test Engineer
  evidence:
    code:
    - backend/src/services/scoring.service.ts
    - backend/src/services/reviews.service.ts
    - frontend/src/pages/HelpPage.tsx
    tests:
    - backend/test/riskScoring.test.mjs
    docs:
    - docs/product/prd.md
    missing:
    - No current residual-suggestion endpoints, per-register configuration model, child-action category/status model, or apply-suggestion
      audit flow exists in code.
    notes:
    - This item preserves the distinct residual-suggestion concept without pretending that PM6-CORE or PM7-CORE already implement
      it.
