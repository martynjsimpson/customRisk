- id: PM12-06
  source_request: REQ-008
  title: Implement orphan file cleanup job for soft-deleted attachments
  type: feature
  capability: attachments-evidence
  status: blocked
  blocked_on: PM12-CORE
  priority: medium
  confidence: medium
  summary: PM12-CORE implements soft-delete for attachments — deletedAt is set on the Attachment row but the physical
    file on disk is not removed. This item implements a background job that identifies orphaned or soft-deleted
    attachments (where no active link rows remain or deletedAt is past the retention window) and physically removes
    the files from storage. The PA explicitly states that hard-delete must never be a user-facing route.
  acceptance:
  - A scheduled or on-demand job runs that identifies Attachment rows with deletedAt set and no active link rows,
    and calls storageProvider.delete() to remove the physical file.
  - The cleanup job refuses to delete a physical file if any active RiskAttachment, ActionAttachment, or
    ReviewAttachment link row still references the Attachment.
  - Cleanup job execution is logged. Errors are captured and do not crash the application.
  - No user-facing hard-delete route exists.
  remaining:
  - Define the cleanup job scheduling approach (cron, startup hook, or triggered endpoint for operators).
  - Define the retention window — how long after deletedAt a file is eligible for physical deletion.
  - Sequence after PM12-CORE is stable.
  dependencies:
  - PM12-CORE
  suggested_agents:
  - principal-architect
  - backend-developer
  evidence:
    code:
    - backend/prisma/schema.prisma
    docs:
    - docs/spikes/SPIKE-007.md
    tests: []
    notes:
    - ADR-0006 and SPIKE-007 both document that physical deletion is deferred to a cleanup job, not a user-facing route.
    - The PA notes that a storage write before a transaction commit can leave a dangling file if the transaction fails;
      the cleanup job is also responsible for collecting those.

