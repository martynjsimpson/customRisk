- id: PM8-CORE
  source_request: REQ-005
  legacy_ids:
  - PM8-01
  - PM8-02
  - PM8-03
  - PM8-04
  - PM8-05
  - PM8-06
  - PM8-07
  - PM8-08
  title: Risk review completeness — comment mode, attestation text UI, and review history panel
  type: feature
  capability: advanced-reviews
  status: blocked
  blocked_on: DRAFT-UNIFIED (unified draft system — prerequisite per SPIKE-008; also requires createRegisterFromTemplate data fidelity fix and Template Compare modal fix before re-proposing)
  priority: high
  confidence: high
  summary: SPIKE-006 audited the current review implementation against PRD sections 10.1–10.4. The core review flow is
    production-ready. Two PRD 10.1 gaps remain — comment mode configuration and attestation text editing UI — and review
    history is unrendered in the frontend. This first slice closes those gaps without requiring any frequency rule engine
    or Risk Response Review work. One schema change required (reviewCommentMode enum on Register), approved by the PA in
    docs/spikes/SPIKE-006.md — backend developer may proceed with the migration without further PA consultation.
  acceptance:
  - A Register Admin can set reviewCommentMode (Disabled / Optional / Mandatory) via the Reviews section of register
    settings. The setting persists and is returned on the register API response.
  - When Disabled — the comment textarea is not shown in ReviewModal, and the backend rejects any request body that
    includes a comment with a validation error.
  - When Mandatory — the Complete Review button is disabled until a non-empty comment is entered; the backend returns
    400 VALIDATION_ERROR if comment is absent or blank.
  - When Optional — existing behaviour is unchanged.
  - A Register Admin can edit the review attestation text via register settings. The next completed review reflects the
    updated text. Previously completed reviews retain the text that was active at review time (the snapshot in
    risk_review.attestation_text is unaffected).
  - The risk detail view contains a review history section listing all reviews for that risk, showing reviewer name,
    date/time, comment (if present), and calculated next review date per row.
  - All existing review tests pass. New backend tests cover each reviewCommentMode enforcement path (disabled rejects
    comment, mandatory requires non-empty comment, optional unchanged).
  - Help content in frontend/public/help/en/ updated to reflect reviewCommentMode and attestation text configuration.
  remaining:
