services:
  app:
    build:
      context: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-customrisk}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-customrisk}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-replace_with_256_bit_random_value}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-replace_with_256_bit_random_value}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-60m}
      JWT_REFRESH_EXPIRY_DAYS: ${JWT_REFRESH_EXPIRY_DAYS:-30}
      BCRYPT_COST_FACTOR: ${BCRYPT_COST_FACTOR:-12}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_LOGIN: ${RATE_LIMIT_MAX_LOGIN:-10}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-replace_with_local_dev_password}
      FEATURE_USER_PREFERENCES: ${FEATURE_USER_PREFERENCES:-false}
      FEATURE_SAML_AUTH: ${FEATURE_SAML_AUTH:-false}
      FEATURE_DRAFT_CONFIG: ${FEATURE_DRAFT_CONFIG:-false}
      FEATURE_CHILD_ACTIONS: ${FEATURE_CHILD_ACTIONS:-false}
      FEATURE_NOTIFICATIONS: ${FEATURE_NOTIFICATIONS:-false}
      FEATURE_CSV_IMPORT: ${FEATURE_CSV_IMPORT:-false}
      FEATURE_ATTACHMENTS: ${FEATURE_ATTACHMENTS:-false}
      FEATURE_API_KEYS: ${FEATURE_API_KEYS:-false}
      FEATURE_WEBHOOKS: ${FEATURE_WEBHOOKS:-false}
      FEATURE_SAVED_VIEWS: ${FEATURE_SAVED_VIEWS:-false}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customrisk}
      POSTGRES_USER: ${POSTGRES_USER:-customrisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
