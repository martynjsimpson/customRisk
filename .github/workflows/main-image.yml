name: Publish Main Image

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  check-ci-status:
    name: Check CI status
    runs-on: ubuntu-latest
    outputs:
      should-publish: ${{ steps.check.outputs.should-publish }}
    steps:
      - name: Determine if CI passed (or was skipped due to prior success)
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # For manual triggers, always proceed
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check if the triggering CI workflow succeeded
          if [ "${{ github.event.workflow_run.conclusion }}" == "success" ]; then
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If CI was skipped, it means the commit already passed CI on another ref.
          # Proceed with publishing if that's the case.
          COMMIT_SHA="${{ github.event.workflow_run.head_sha }}"
          REPO="${{ github.repository }}"

          SUCCESSFUL_RUNS=$(gh api \
            "/repos/$REPO/actions/workflows/ci.yml/runs" \
            -f "head_sha=$COMMIT_SHA" \
            -f "status=completed" \
            -f "conclusion=success" \
            --jq ".workflow_runs | length")

          if [ "$SUCCESSFUL_RUNS" -gt "0" ]; then
            echo "Commit $COMMIT_SHA has passed CI on another ref, proceeding with publish"
            echo "should-publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Commit $COMMIT_SHA has not passed CI, skipping publish"
            echo "should-publish=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    name: Publish Main Image
    runs-on: ubuntu-latest
    needs: check-ci-status
    if: needs.check-ci-status.outputs.should-publish == 'true'

    steps:
      - name: Resolve image parameters
        id: params
        run: |
          HEAD="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "sha_full=$HEAD" >> "$GITHUB_OUTPUT"
          echo "sha_short=${HEAD:0:7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.params.outputs.sha_full }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.params.outputs.image }}
          tags: |
            type=raw,value=main
            type=raw,value=sha-${{ steps.params.outputs.sha_short }}
          labels: |
            org.opencontainers.image.revision=${{ steps.params.outputs.sha_full }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Note: Docker image Node version is controlled by Dockerfile base image (node:24-alpine)
