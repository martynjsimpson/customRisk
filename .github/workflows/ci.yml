name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (backend, frontend, shared in parallel)
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Apply database migrations
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > backend/.env
          npm run db:migrate

      - name: Test (backend, frontend, shared in parallel)
        run: npm run test

      - name: Validate Prisma schema
        run: npm --workspace @custom-risk/backend exec -- prisma validate

      - name: Build (shared, backend, frontend in parallel)
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: customrisk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
